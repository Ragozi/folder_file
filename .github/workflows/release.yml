name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Set this to the URL of the Lovable-managed UI repo once it's connected.
# It can be in the same org or a different one. The workflow shallow-clones
# it, runs `npm run build`, and copies the dist output into
# src/folder_file/web before PyInstaller bundles everything.
env:
  UI_REPO: ""        # e.g. https://github.com/Ragozi/folder-file-ui
  UI_REPO_REF: main  # branch or tag in the UI repo

jobs:
  build_ui:
    name: Build UI bundle
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Skip if UI_REPO is unset
        id: gate
        run: |
          if [ -z "${{ env.UI_REPO }}" ]; then
            echo "UI_REPO env var not set; skipping UI build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout UI repo
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPO }}
          ref: ${{ env.UI_REPO_REF }}
          path: ui
          token: ${{ secrets.UI_REPO_TOKEN || github.token }}

      - name: Set up Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install + build UI
        id: build
        if: steps.gate.outputs.skip == 'false'
        run: |
          cd ui
          npm ci
          npm run build
          # Vite outputs to dist/, CRA outputs to build/. Pick whichever exists.
          if [ -d dist ]; then OUT=dist; else OUT=build; fi
          echo "OUT=$OUT" >> $GITHUB_OUTPUT
          echo "built=true" >> $GITHUB_OUTPUT

      - name: Upload built UI as artifact
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/${{ steps.build.outputs.OUT }}
          retention-days: 1

  build_exe:
    name: Build (${{ matrix.os }})
    needs: build_ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: folder_file-windows
          - os: macos-latest
            artifact_name: folder_file-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run tests
        run: pytest -q

      - name: Download UI bundle (if built)
        if: needs.build_ui.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/folder_file/web

      - name: PyInstaller build
        run: pyinstaller packaging/folder_file.spec --noconfirm

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/folder_file
          retention-days: 7

  windows_installer:
    name: Build Windows installer
    needs: build_exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: folder_file-windows
          path: dist/folder_file

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: folder_file-windows-installer
          path: packaging/Output/folder_file_setup.exe
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build_exe, windows_installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: folder_file-windows
          path: artifacts/win

      - name: Download Mac binary
        uses: actions/download-artifact@v4
        with:
          name: folder_file-macos
          path: artifacts/mac

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: folder_file-windows-installer
          path: artifacts/installer

      - name: Zip artifacts
        run: |
          cd artifacts
          zip -r folder_file-windows.zip win
          zip -r folder_file-macos.zip mac
          cp installer/folder_file_setup.exe folder_file_setup.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/folder_file-windows.zip
            artifacts/folder_file-macos.zip
            artifacts/folder_file_setup.exe
          generate_release_notes: true
