[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folder_file"
version = "0.1.0"
description = "Interactive CLI that downloads attachments from a chosen IMAP folder, renames them sequentially, and saves them locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ragozi" }]
dependencies = [
    "keyring>=25.0",
    "questionary>=2.0",
    "python-dateutil>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "msal>=1.30",
    "httpx>=0.27",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
folder_file = "folder_file.cli:main"
folder_file_server = "folder_file.server:main"

[project.gui-scripts]
folder_file_app = "folder_file.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
